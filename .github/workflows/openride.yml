name: Tests OpenRide

on:
  # Les branches des demandes de fusion sont testées par l'événement pull_request seulement :
  # un envoi testé deux fois (push + pull_request) doublait la file d'attente de la CI.
  push:
    branches: [main]
    paths:
      - "Open_ride_linux/**"
      - ".github/workflows/openride.yml"
  pull_request:
    paths:
      - "Open_ride_linux/**"
      - ".github/workflows/openride.yml"
  workflow_dispatch:
  # Une fois par semaine (lundi 5 h UTC) : détecte une dérive des dépendances non bornées
  # de la colonne Python 3.11, installée sans constraints.txt.
  schedule:
    - cron: "0 5 * * 1"

# Sur une demande de fusion, un nouvel envoi annule l'exécution en cours. Sur main, chaque
# envoi est testé jusqu'au bout (audit J : des fusions rapprochées avaient annulé les runs de main).
concurrency:
  group: openride-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jeton GitHub en lecture seule : les tests n'écrivent rien dans le dépôt.
permissions:
  contents: read

defaults:
  run:
    working-directory: Open_ride_linux

jobs:
  # Audit du 22 novembre (R1) : analyse statique des erreurs de Python (imports et variables inutiles,
  # noms inconnus, clés en double), règles dans Open_ride_linux/ruff.toml. Quelques secondes, en parallèle.
  analyse:
    name: analyse statique (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Installation de Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installation de ruff
        run: pip install -c constraints.txt ruff

      - name: ruff check
        run: ruff check --output-format github .

  # Lot X52 : la colonne 3.14 (avec constraints.txt : pas de dérive des dépendances qui ferait échouer une PR
  # sans rapport) sur les demandes de fusion et sur main ; la colonne 3.11 sur demande et chaque lundi seulement
  # (audit du 22 novembre, P1 : elle doublait la file d'attente de chaque fusion). Filet de la 3.11 partout :
  # compilation de tout le code Python par Python 3.11 (syntaxe trop récente).
  # Audit du 22 novembre (P1) : tests du core et du compilateur répartis en 3 parties de durée voisine, sur
  # 3 machines en parallèle (OPENRIDE_TESTS_PARTIE, scripts/isolation_tests.py, durées de scripts/durees_tests.json) ;
  # les 3 parties jouent ensemble tous les tests. Le job « python (3.14) » réunit leurs résultats.
  python-partie:
    name: python ${{ matrix.python-version }} (partie ${{ matrix.partie }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11", "3.14"]' || '["3.14"]') }}
        partie: [1, 2, 3]
    env:
      OPENRIDE_TESTS_PARTIE: ${{ matrix.partie }}/3
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Python 3.11 pour la compilation
        if: matrix.python-version == '3.14' && matrix.partie == 1
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Code compilable par Python 3.11
        if: matrix.python-version == '3.14' && matrix.partie == 1
        run: python3.11 -m compileall -q core/src compiler/src scripts engine/tests

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Open_ride_linux/core/pyproject.toml
            Open_ride_linux/compiler/pyproject.toml

      - name: Installation des paquets (Python 3.11, sans contraintes)
        if: matrix.python-version == '3.11'
        run: |
          pip install -e "core[dev]"
          pip install -e "compiler[dev,worldgen]"

      - name: Installation des paquets (Python 3.14, avec constraints.txt)
        if: matrix.python-version == '3.14'
        run: |
          pip install -c constraints.txt -e "core[dev]"
          pip install -c constraints.txt -e "compiler[dev,worldgen]"

      - name: Cohérence des paquets installés
        run: pip check

      - name: Tests du core (partie ${{ matrix.partie }}/3)
        run: cd core && pytest -q --junitxml=../junit/core.xml

      - name: Tests du compilateur (partie ${{ matrix.partie }}/3)
        run: cd compiler && pytest -q --junitxml=../junit/compiler.xml

      - name: Contrôle des vecteurs de route
        if: matrix.partie == 1
        run: python -m openride_core.tools.route_vectors --check

      # Lot X52 : les nombres de tests ne sont plus écrits dans la doc ; ils sont donnés ici, dans le résumé du run.
      - name: Nombre de tests (résumé du run)
        if: matrix.python-version == '3.14' && matrix.partie == 1
        run: env -u OPENRIDE_TESTS_PARTIE python3 scripts/recompte_tests.py --resume "$GITHUB_STEP_SUMMARY"

      # Lot X54 : le tableau des lots n'est plus écrit dans 00_INDEX.md ; les nombres par série sont donnés ici.
      - name: Lots par série (résumé du run)
        if: matrix.python-version == '3.14' && matrix.partie == 1
        run: python3 scripts/index_lots.py --resume "$GITHUB_STEP_SUMMARY"

      # Rapports JUnit gardés (lot X3) : durée et statut de chaque test, lus par scripts/stabilite_tests.py
      # et par scripts/durees_tests.py (durées qui équilibrent les parties).
      - name: Rapports JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-${{ matrix.python-version }}-partie-${{ matrix.partie }}
          path: Open_ride_linux/junit/
          if-no-files-found: ignore

  # Résultat unique des parties, sous le nom de l'ancien job (les règles de fusion qui l'attendent restent valables).
  python:
    name: python (3.14)
    needs: python-partie
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Pas de copie du dépôt dans ce job : le dossier par défaut Open_ride_linux/ n'existe pas.
    defaults:
      run:
        working-directory: /
    steps:
      - name: Toutes les parties réussies
        run: |
          echo "Parties : ${{ needs.python-partie.result }}"
          test "${{ needs.python-partie.result }}" = success

  engine:
    name: engine (Godot 4.7)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Installation de Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Open_ride_linux/core/pyproject.toml
            Open_ride_linux/compiler/pyproject.toml

      - name: Installation du core et du compilateur
        # Le compilateur produit les données du test des couches OSM (lot K4, make_osm_world.py).
        run: pip install -c constraints.txt -e "core[dev]" -e compiler

      - name: Cache de Godot 4.7
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/.cache/godot-4.7.2
          key: godot-4.7.2-stable-linux-x86_64

      - name: Téléchargement de Godot 4.7
        if: steps.cache-godot.outputs.cache-hit != 'true'
        env:
          GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
        run: |
          mkdir -p ~/.cache/godot-4.7.2
          curl -fsSL -o /tmp/Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          # Empreinte de SHA512-SUMS.txt de la publication 4.7.2-stable (revue de code vague 5, O2-19).
          echo "$GODOT_SHA512  /tmp/Godot_v4.7.2-stable_linux.x86_64.zip" | sha512sum -c -
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d ~/.cache/godot-4.7.2
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64

      - name: Xvfb et Vulkan logiciel (Forward+ comme le jeu, rendu_jeu.py)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers

      - name: Tests de l'engine sans écran
        run: |
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
          REQUIRE_RENDER=1 ENGINE_JUNIT="$PWD/junit/engine.xml" GODOT="$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" engine/tests/run_engine_tests.sh

      - name: Essai de bout en bout (vrai core et vrai engine, lot J8)
        run: GODOT="$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" engine/tests/run_e2e.sh

      - name: Captures des flancs de colline (terrain, low, medium et high)
        # Demandes de fusion qui touchent le terrain ou ses shaders : vraie scène sur la démo (tour « flancs »,
        # relief de séance), captures jointes au run pour validation (règle du propriétaire du 29 octobre).
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          # Liste lue à part : une erreur de git diff arrête l'étape au lieu de sauter les captures (O2-19).
          changes="$(git diff --name-only FETCH_HEAD HEAD)"
          if ! printf '%s\n' "$changes" | grep -qE '^Open_ride_linux/engine/(scripts/(terrain_tiles|world_streamer|living_world)\.gd|shaders/|tests/tours/flancs\.json)'; then
            echo "Terrain inchangé : captures sautées"; exit 0
          fi
          for q in low medium high; do
            python3 engine/tests/tour_visuel.py --godot "$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
              --world demo --tour flancs --quality "$q" --out "$RUNNER_TEMP/captures_flancs/$q"
          done

      - name: Captures des flancs de colline (pièce jointe)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: captures_flancs
          path: ${{ runner.temp }}/captures_flancs
          retention-days: 14
          if-no-files-found: ignore

      - name: Banc visuel du Cyber-Rogue (run X40 rejouée dans la scène, lot X41)
        run: |
          python3 engine/tests/rogue_bench.py --godot "$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
            --out "$RUNNER_TEMP/rogue_bench"

      - name: Rapport du banc visuel du Cyber-Rogue
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rogue_bench
          path: ${{ runner.temp }}/rogue_bench
          retention-days: 7

      - name: Rapport JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-engine
          path: Open_ride_linux/junit/
          if-no-files-found: ignore

  # Audit du 22 novembre (P1) : le banc des menus (49 min sur une machine) passe sur 3 machines en parallèle,
  # à côté du job engine (--partie : scénarios K, K+3…, même rotation des voies qu'en un seul passage).
  menus:
    name: banc des menus (partie ${{ matrix.partie }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partie: [1, 2, 3]
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Installation de Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Open_ride_linux/core/pyproject.toml
            Open_ride_linux/compiler/pyproject.toml

      - name: Installation du core et du compilateur
        # Le compilateur produit les données du test des couches OSM (lot K4, make_osm_world.py).
        run: pip install -c constraints.txt -e "core[dev]" -e compiler

      - name: Cache de Godot 4.7
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/.cache/godot-4.7.2
          key: godot-4.7.2-stable-linux-x86_64

      - name: Téléchargement de Godot 4.7
        if: steps.cache-godot.outputs.cache-hit != 'true'
        env:
          GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
        run: |
          mkdir -p ~/.cache/godot-4.7.2
          curl -fsSL -o /tmp/Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          # Empreinte de SHA512-SUMS.txt de la publication 4.7.2-stable (revue de code vague 5, O2-19).
          echo "$GODOT_SHA512  /tmp/Godot_v4.7.2-stable_linux.x86_64.zip" | sha512sum -c -
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d ~/.cache/godot-4.7.2
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64

      - name: Xvfb et Vulkan logiciel (Forward+ comme le jeu, rendu_jeu.py)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers

      - name: Banc des menus (Click simulé, clavier, souris ; une voie par scénario ; partie ${{ matrix.partie }}/3)
        run: |
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
          python3 engine/tests/menu_bench.py --godot "$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
            --rotation --partie ${{ matrix.partie }}/3 --out "$RUNNER_TEMP/menu_bench"

      - name: Rapport du banc des menus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: menu_bench-partie-${{ matrix.partie }}
          path: ${{ runner.temp }}/menu_bench
          retention-days: 7

  # Audit du 22 novembre (R13) : couverture du code mesurée une fois par semaine (run du lundi et sur demande),
  # sans seuil bloquant : le résumé du run donne le pourcentage du core et du compilateur, le rapport HTML est joint.
  couverture:
    name: couverture (hebdomadaire)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Installation de Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Open_ride_linux/core/pyproject.toml
            Open_ride_linux/compiler/pyproject.toml

      - name: Installation des paquets et de coverage
        run: |
          pip install -c constraints.txt -e "core[dev]" coverage
          pip install -c constraints.txt -e "compiler[dev,worldgen]"

      - name: Tests sous coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/couverture/.coverage
        run: |
          mkdir -p "$RUNNER_TEMP/couverture"
          (cd core && coverage run -p --source=openride_core -m pytest -q) || true
          (cd compiler && coverage run -p --source=openride_compiler -m pytest -q) || true

      - name: Rapport de couverture (résumé du run)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/couverture/.coverage
        run: |
          coverage combine "$RUNNER_TEMP/couverture"
          { echo "### Couverture du code (core et compilateur)"; echo; echo '```'; coverage report --skip-covered --sort=cover | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          coverage html -d "$RUNNER_TEMP/couverture/html"

      - name: Rapport HTML de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture
          path: ${{ runner.temp }}/couverture/html
          retention-days: 30
          if-no-files-found: ignore

  # Lot X24 : audit hebdomadaire des dépendances (vulnérabilités connues, actions en retard, paquets
  # anciens), seulement dans le run du lundi et sur demande. Échoue si une vulnérabilité est connue.
  dependances:
    name: audit des dépendances
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Installation de Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Installation de pip-audit
        run: pip install -c constraints.txt pip-audit

      - name: Audit
        run: python3 scripts/audit_dependances.py --out "$RUNNER_TEMP/deps"

      - name: Résumé de l'audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependances
          path: ${{ runner.temp }}/deps
          retention-days: 30

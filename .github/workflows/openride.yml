name: Tests OpenRide

on:
  # Les branches des demandes de fusion sont testées par l'événement pull_request seulement :
  # un envoi testé deux fois (push + pull_request) doublait la file d'attente de la CI.
  push:
    branches: [main]
    paths:
      - "Open_ride_linux/**"
      - ".github/workflows/openride.yml"
  pull_request:
    paths:
      - "Open_ride_linux/**"
      - ".github/workflows/openride.yml"
  workflow_dispatch:
  # Une fois par semaine (lundi 5 h UTC) : détecte une dérive des dépendances non bornées
  # de la colonne Python 3.11, installée sans constraints.txt.
  schedule:
    - cron: "0 5 * * 1"

# Sur une demande de fusion, un nouvel envoi annule l'exécution en cours. Sur main, chaque
# envoi est testé jusqu'au bout (audit J : des fusions rapprochées avaient annulé les runs de main).
concurrency:
  group: openride-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jeton GitHub en lecture seule : les tests n'écrivent rien dans le dépôt.
permissions:
  contents: read

defaults:
  run:
    working-directory: Open_ride_linux

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Open_ride_linux/core/pyproject.toml
            Open_ride_linux/compiler/pyproject.toml

      - name: Installation des paquets (Python 3.11, sans contraintes)
        if: matrix.python-version == '3.11'
        run: |
          pip install -e "core[dev]"
          pip install -e "compiler[dev,worldgen]"

      - name: Installation des paquets (Python 3.14, avec constraints.txt)
        if: matrix.python-version == '3.14'
        run: |
          pip install -c constraints.txt -e "core[dev]"
          pip install -c constraints.txt -e "compiler[dev,worldgen]"

      - name: Cohérence des paquets installés
        run: pip check

      - name: Tests du core
        run: cd core && pytest -q --junitxml=../junit/core.xml

      - name: Tests du compilateur
        run: cd compiler && pytest -q --junitxml=../junit/compiler.xml

      - name: Contrôle des vecteurs de route
        run: python -m openride_core.tools.route_vectors --check

      # Rapports JUnit gardés (lot X3) : durée et statut de chaque test, lus par scripts/stabilite_tests.py.
      - name: Rapports JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: junit-python-${{ matrix.python-version }}
          path: Open_ride_linux/junit/
          if-no-files-found: ignore

  engine:
    name: engine (Godot 4.7)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Installation de Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Open_ride_linux/core/pyproject.toml
            Open_ride_linux/compiler/pyproject.toml

      - name: Installation du core et du compilateur
        # Le compilateur produit les données du test des couches OSM (lot K4, make_osm_world.py).
        run: pip install -c constraints.txt -e "core[dev]" -e compiler

      - name: Cache de Godot 4.7
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-4.7.2
          key: godot-4.7.2-stable-linux-x86_64

      - name: Téléchargement de Godot 4.7
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/godot-4.7.2
          curl -fsSL -o /tmp/Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d ~/.cache/godot-4.7.2
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64

      - name: Xvfb et OpenGL logiciel (tests de rendu du shader, lot E2)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Tests de l'engine sans écran
        run: |
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
          REQUIRE_RENDER=1 ENGINE_JUNIT="$PWD/junit/engine.xml" GODOT="$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" engine/tests/run_engine_tests.sh

      - name: Essai de bout en bout (vrai core et vrai engine, lot J8)
        run: GODOT="$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" engine/tests/run_e2e.sh

      - name: Banc des menus (Click simulé, clavier, souris ; une voie par scénario)
        run: |
          python3 engine/tests/menu_bench.py --godot "$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
            --rotation --out "$RUNNER_TEMP/menu_bench"

      - name: Rapport du banc des menus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: menu_bench
          path: ${{ runner.temp }}/menu_bench
          retention-days: 7

      - name: Banc visuel du Cyber-Rogue (run X40 rejouée dans la scène, lot X41)
        run: |
          python3 engine/tests/rogue_bench.py --godot "$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64" \
            --out "$RUNNER_TEMP/rogue_bench"

      - name: Rapport du banc visuel du Cyber-Rogue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rogue_bench
          path: ${{ runner.temp }}/rogue_bench
          retention-days: 7

      - name: Rapport JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: junit-engine
          path: Open_ride_linux/junit/
          if-no-files-found: ignore

  # Lot X24 : audit hebdomadaire des dépendances (vulnérabilités connues, actions en retard, paquets
  # anciens), seulement dans le run du lundi et sur demande. Échoue si une vulnérabilité est connue.
  dependances:
    name: audit des dépendances
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Installation de Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installation de pip-audit
        run: pip install -c constraints.txt pip-audit

      - name: Audit
        run: python3 scripts/audit_dependances.py --out "$RUNNER_TEMP/deps"

      - name: Résumé de l'audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependances
          path: ${{ runner.temp }}/deps
          retention-days: 30

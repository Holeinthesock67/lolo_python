name: Export de l'engine

# Lot EX2 (cadrage J9 : engine exporté en .pck) : export « release » de l'engine, puis essai de bout en
# bout (vrai core, trainer simulé) sur le binaire exporté au lieu de « godot --path engine » (essai E1).
# Un fichier lu à l'exécution mais oublié par les filtres de engine/export_presets.cfg fait échouer ce job.
# Fichier à part de openride.yml : ne touche pas la CI de main ni les PR qui la modifient.
on:
  push:
    branches: [main]
    paths:
      - "Open_ride_linux/engine/**"
      - "Open_ride_linux/core/**"
      - "Open_ride_linux/scripts/export_engine.sh"
      - ".github/workflows/openride-export.yml"
  pull_request:
    paths:
      - "Open_ride_linux/engine/**"
      - "Open_ride_linux/core/**"
      - "Open_ride_linux/scripts/export_engine.sh"
      - ".github/workflows/openride-export.yml"
  workflow_dispatch:

concurrency:
  group: openride-export-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: Open_ride_linux

jobs:
  export:
    name: engine exporté (release + .pck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT: /home/runner/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Installation de Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Open_ride_linux/core/pyproject.toml

      - name: Installation du core
        run: pip install -c constraints.txt -e "core[dev]"

      - name: Cache de Godot 4.7
        id: cache-godot
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/godot-4.7.2
          key: godot-4.7.2-stable-linux-x86_64

      - name: Téléchargement de Godot 4.7
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/godot-4.7.2
          curl -fsSL -o /tmp/Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/Godot_v4.7.2-stable_linux.x86_64.zip -d ~/.cache/godot-4.7.2
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64

      # Seul le modèle linux_release.x86_64 (73 Mo) est gardé en cache, pas l'archive de 1,2 Go.
      - name: Cache du modèle d'export
        id: cache-template
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-template-linux-release-x86_64

      - name: Export « release » de l'engine
        run: |
          chmod +x "$GODOT"
          scripts/export_engine.sh --install-template

      - name: Essai de bout en bout sur l'engine exporté
        run: python3 engine/tests/e2e_check.py --exported build/engine/openride.x86_64

      - name: Journal de l'export (pièce jointe)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: export-engine
          path: Open_ride_linux/build/engine/export.log
          if-no-files-found: ignore

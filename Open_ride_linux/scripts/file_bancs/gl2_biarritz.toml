# File du lot GL2 (gels du monde ouvert, essai du 22/11) : Biarritz 12 min avec choix aux carrefours, high d'abord
# (qualité de l'essai), puis medium et low. Mesure seule : les lignes « [gel] » du journal de l'engine nomment
# l'étape du fil principal bloquée et sa durée ; gels.txt les réunit avec « [gigue] state » et les carrefours.
# Lancement sur le PC, depuis ~/Games/lolo_python/Open_ride_linux :
#   python3 scripts/file_bancs.py lancer scripts/file_bancs/gl2_biarritz.toml
# Cache SÉPARÉ obligatoire (règle du user) : le banc ne touche jamais ~/OpenRide/Cache/monde.
# La tête est à remplir par le fil de fusion au moment du lancement (`tete`).

[file]
depot = "~/Games/lolo_python"
sortie = "~/mesures-2026-11-01-auto/file/rGL2"
avant_etape = "bash ~/Games/lolo_python/Open_ride_linux/scripts/file_bancs/portail_pc.sh"
apres_etape = "~/mesures-2026-11-01-auto/pousse_auto.sh rGL2-{pr}-{etape} {dossier}"
attente_s = 60

[[pr]]
id = "rGL2"
branche = "claude/project-thread-7qajwx"
cache = "separe"
risque = 1                               # jamais tourné
# Fumée (~5 min) : import Godot et test du détecteur de gel.
fumee = """(cd engine && timeout 300 ~/Applications/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import >/dev/null 2>&1); \
GODOT=~/Applications/godot/Godot_v4.7.2-stable_linux.x86_64 UNIT=test_stall_watch bash engine/tests/run_engine_tests.sh"""
fumee_delai_min = 10

[[pr.etape]]
id = "high"
commande = """python engine/tests/menu_bench.py --native --scenario gel_ow_biarritz --voies clavier --qualite high --captures ecrans --out {sortie}/banc --engine-arg=-- --engine-arg=--perf-probe={sortie}/moteur.csv; rc=$?; \
python engine/tests/perf_probe.py report {sortie}/moteur.csv --out {sortie}/sonde --quality high --budgets; \
grep -rh "\\[gel\\]\\|\\[gigue\\] state\\|world_revision\\|Carrefour" {sortie}/banc > {sortie}/gels.txt; exit $rc"""
delai_min = 35

[[pr.etape]]
id = "medium"
commande = """python engine/tests/menu_bench.py --native --scenario gel_ow_biarritz --voies clavier --qualite medium --captures ecrans --out {sortie}/banc --engine-arg=-- --engine-arg=--perf-probe={sortie}/moteur.csv; rc=$?; \
python engine/tests/perf_probe.py report {sortie}/moteur.csv --out {sortie}/sonde --quality medium --budgets; \
grep -rh "\\[gel\\]\\|\\[gigue\\] state\\|world_revision\\|Carrefour" {sortie}/banc > {sortie}/gels.txt; exit $rc"""
delai_min = 35

[[pr.etape]]
id = "low"
commande = """python engine/tests/menu_bench.py --native --scenario gel_ow_biarritz --voies clavier --qualite low --captures ecrans --out {sortie}/banc --engine-arg=-- --engine-arg=--perf-probe={sortie}/moteur.csv; rc=$?; \
python engine/tests/perf_probe.py report {sortie}/moteur.csv --out {sortie}/sonde --quality low --budgets; \
grep -rh "\\[gel\\]\\|\\[gigue\\] state\\|world_revision\\|Carrefour" {sortie}/banc > {sortie}/gels.txt; exit $rc"""
delai_min = 35

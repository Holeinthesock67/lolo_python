# Banc de la pile « routes générées » (#984 ponts, #1026 bornes, #1120 couches OSM, #1073 relief IGN/FABDEM, #1119
# rivières), demandé le 28/11 : UN seul banc pour les 5 PR, créneau ~20h50-22h50, avant toute fusion. Règle : pas de
# nouvel échec de controle_sol_route par rapport à main (les échecs déjà sur main sont notés sans bloquer).
# Périmètre de non-régression validé le 28/11 (statut/ANALYSE_IMPACT_OW_2026-11-28.md §2), circuit de la manche 1 retiré
# par le propriétaire (28/11 14h00) : Alpe d'Huez, Tour du lac d'Annecy, démo DB1, Ballon d'Alsace, en medium, paire
# main/pile le même soir sur le même PC.
# Trois des cinq PR changent le COMPILATEUR : les parcours sont donc RECOMPILÉS de chaque côté (routes_mondes.sh, avec
# le compilateur du worktree), hors ligne, depuis les mêmes traces et les mêmes caches OSM / relief, préparés une fois
# par la fumée (routes_sources.sh, réseau) dans ~/mesures-2026-11-01-auto/routes-pile. Couches données en toutes
# lettres, identiques des deux côtés (eau, maisons, végétation, routes, ponts). Aucun monde ouvert : ni
# ~/OpenRide/Cache/monde, ni ~/OpenRide, ni les parcours installés ne sont lus ou écrits. #1073 ne change que le relief du
# monde ouvert (parcours compilés inchangés, lot RL4) : ce banc vérifie seulement qu'elle ne casse rien.
# Les traces sont aussi préparées par l'étape « mondes » de chaque côté si la fumée n'a pas encore tourné (idempotent).
# Étapes : mondes (compilation), sol (controle_sol_route sur les 4 mondes), puis 4 parcours (captures aux points tirés
# du parcours + 5 min en roulant, scénario nominal explicite, sonde), côté main d'abord, puis côté pile.
# Budget PC : ~2 h (fumée ~15 min réseau compris, 2 compilations ~10 min, 2 contrôles du sol ~10 min, 8 parcours
# ~10 min) ; au-delà de 3 h (+50 %) : arrêt et point avec le propriétaire. Au plus deux tours de correction ensuite.
# Lancement sur le PC, depuis ~/Games/lolo_python/Open_ride_linux :
#   python3 scripts/file_bancs.py verifier scripts/file_bancs/routes_pile.toml
#   python3 scripts/file_bancs.py lancer scripts/file_bancs/routes_pile.toml
# main n'a pas les scripts routes_*.sh : ses étapes les reprennent de la branche de la pile (git show), même script.

[file]
depot = "~/Games/lolo_python"
sortie = "~/mesures-2026-11-01-auto/file/rROUTES"
avant_etape = "bash ~/Games/lolo_python/Open_ride_linux/scripts/file_bancs/portail_pc.sh"
apres_etape = "~/mesures-2026-11-01-auto/pousse_auto.sh rROUTES-{pr}-{etape} {dossier}"
attente_s = 60

[[pr]]
id = "rROUTES"
branche = "claude/project-thread-indjeh"
cache = "separe"
categorie = "rendu"
risque = 1                               # jamais tourné
# Fumée : import Godot, tests des lots (ponts, bornes), puis traces et caches communs (réseau).
fumee = """(cd engine && timeout 300 ~/Applications/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import >/dev/null 2>&1); \
GODOT=~/Applications/godot/Godot_v4.7.2-stable_linux.x86_64 UNIT=test_bridge_mesh bash engine/tests/run_engine_tests.sh && \
GODOT=~/Applications/godot/Godot_v4.7.2-stable_linux.x86_64 UNIT=test_road_skirt bash engine/tests/run_engine_tests.sh && \
GODOT=~/Applications/godot/Godot_v4.7.2-stable_linux.x86_64 UNIT=test_roadside_ground bash engine/tests/run_engine_tests.sh && \
bash scripts/file_bancs/routes_sources.sh"""
fumee_delai_min = 30

# ---- côté main ----
[[pr.etape]]
id = "main-mondes"
sur = "main"
commande = "mkdir -p {sortie} && for s in routes_sources.sh routes_mondes.sh; do git show origin/claude/project-thread-indjeh:Open_ride_linux/scripts/file_bancs/$s > {sortie}/$s; done && bash {sortie}/routes_sources.sh && bash {sortie}/routes_mondes.sh main"
delai_min = 30

[[pr.etape]]
id = "main-sol"
sur = "main"
commande = "python3 scripts/controle_sol_route.py --out {sortie} ~/mesures-2026-11-01-auto/routes-pile/mondes-main/*.world"
delai_min = 20

[[pr.etape]]
id = "main-alpe"                     # R1 Alpe d'Huez : lacets et épingles
sur = "main"
commande = "mkdir -p {sortie} && git show origin/claude/project-thread-indjeh:Open_ride_linux/scripts/file_bancs/routes_etape.sh > {sortie}/routes_etape.sh && bash {sortie}/routes_etape.sh main alpe {sortie}"
delai_min = 20

[[pr.etape]]
id = "main-annecy"                     # R2 Tour du lac d'Annecy (#943)
sur = "main"
commande = "mkdir -p {sortie} && git show origin/claude/project-thread-indjeh:Open_ride_linux/scripts/file_bancs/routes_etape.sh > {sortie}/routes_etape.sh && bash {sortie}/routes_etape.sh main annecy {sortie}"
delai_min = 20

[[pr.etape]]
id = "main-db1"                     # R3 démo DB1 « Tour des nouveaux paysages »
sur = "main"
commande = "mkdir -p {sortie} && git show origin/claude/project-thread-indjeh:Open_ride_linux/scripts/file_bancs/routes_etape.sh > {sortie}/routes_etape.sh && bash {sortie}/routes_etape.sh main paysages {sortie}"
delai_min = 20

[[pr.etape]]
id = "main-ballon"                     # R5 Ballon d'Alsace
sur = "main"
commande = "mkdir -p {sortie} && git show origin/claude/project-thread-indjeh:Open_ride_linux/scripts/file_bancs/routes_etape.sh > {sortie}/routes_etape.sh && bash {sortie}/routes_etape.sh main ballon {sortie}"
delai_min = 20

# ---- côté pile ----
[[pr.etape]]
id = "mondes"
sur = "branche"
commande = "bash scripts/file_bancs/routes_sources.sh && bash scripts/file_bancs/routes_mondes.sh pile"
delai_min = 30

[[pr.etape]]
id = "sol"
sur = "branche"
commande = "python3 scripts/controle_sol_route.py --out {sortie} ~/mesures-2026-11-01-auto/routes-pile/mondes-pile/*.world"
delai_min = 20

[[pr.etape]]
id = "alpe"                     # R1 Alpe d'Huez : lacets et épingles
sur = "branche"
commande = "bash scripts/file_bancs/routes_etape.sh pile alpe {sortie}"
delai_min = 20

[[pr.etape]]
id = "annecy"                     # R2 Tour du lac d'Annecy (#943)
sur = "branche"
commande = "bash scripts/file_bancs/routes_etape.sh pile annecy {sortie}"
delai_min = 20

[[pr.etape]]
id = "db1"                     # R3 démo DB1 « Tour des nouveaux paysages »
sur = "branche"
commande = "bash scripts/file_bancs/routes_etape.sh pile paysages {sortie}"
delai_min = 20

[[pr.etape]]
id = "ballon"                     # R5 Ballon d'Alsace
sur = "branche"
commande = "bash scripts/file_bancs/routes_etape.sh pile ballon {sortie}"
delai_min = 20

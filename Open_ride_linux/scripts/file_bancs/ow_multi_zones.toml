# Parcours installés (démos, contenus de départ, pack des cols : une quarantaine, plus de 15 min) : contrôlés une
# seule fois ici, et non plus après chaque zone (délai de 30 min dépassé sur 6 zones le 26/11).
[[pr.etape]]
id = "sol-parcours-installes"
commande = """python3 scripts/controle_sol_route.py --out {sortie}/sol --dernieres 0 --delai-s 3300"""
delai_min = 60

# Configuration locale d'OpenRide : ~/OpenRide/config.toml (hors du dépôt).
# Créée au premier lancement depuis scripts/config.example.toml. Toute clé absente prend sa
# valeur par défaut (docs/SRS_v1.1.md §11). Les adresses et noms réels des appareils ne vont
# qu'ici : « openride-core devices --save » les écrit pour vous.

[rider]
ftp_w = 250          # puissance critique (W), utilisée par les séances ERG
mass_kg = 75         # masse du cycliste (kg)

[bike]
mass_kg = 9

[trainer]
device_name = "HomeTrainer"   # fragment du nom annoncé par le home trainer
difficulty_pct = 50           # 0 à 100 : part de la pente ressentie en SIM
# trace_ftms = false          # trace horodatée de chaque échange Control Point FTMS (lot Q3)

[drivers]
trainer = "ftms"              # "ftms" (Bluetooth), "mock" ou "sim" (Bluetooth simulé)
input = "click"               # "click", "keyboard", "none" ou "sim"
trainer_address = ""          # rempli par openride-core devices --save
click_address = ""            # boîtier « + » du Click
click_minus_address = ""      # boîtier « − » du Click
click_trace_raw = false       # trace brute des notifications Click dans le journal
click_mute_after_s = 60       # délai avant d'alerter si un boîtier ne transmet plus d'appui (s)
click_rehandshake_s = 0       # intervalle de tentative de reprise (s, 0 = désactivé)
hr = "none"                   # ceinture cardio : "none" ou "ble"
hr_address = ""
hr_name = ""

[render]
quality = "low"               # low, medium, high
theme = "default"
living = true                 # décor vivant de la série P (vent, nuages, sons) ; false : rendu de la 1.0
chart = "reduced"             # courbes de la séance (lot O14) : hidden, reduced (cible et puissance), full
camera = "follow_near"        # vue de caméra : subjective, follow_near, follow_far ou side (la dernière vue choisie y est écrite)
fps = "off"                   # compteur d'images/s en haut à droite du HUD : off, on, detail (+ temps CPU et GPU, pour les essais)
display = "fullscreen"        # windowed, borderless (plein écran sans bordure) ou fullscreen (exclusif)

[bots]
level_pct = 100               # niveau des bots à profil, 50 à 150 % de ta FTP (lot T13, réglable dans le menu)

[audio]                       # volumes en % (0 : coupé), réglables dans le menu (docs/AUDIO.md)
master_pct = 100
ride_pct = 100                # vent et roue libre
ambience_pct = 100            # fonds, cloches, véhicules, foule, passants
events_pct = 100              # bips du Click, bloc ERG, consignes, jingles

[engine]
godot = ""                    # chemin de Godot 4.3 (rempli par scripts/install.sh)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openride-compiler"
version = "0.1.0"
description = "OpenRide Linux – compilateur de parcours : GPX vers .world (couches route et terrain)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "jsonschema>=4",   # theme-check (theme.py), importé au chargement de la ligne de commande
    "fit-tool>=0.9",   # lecture des traces FIT (track_formats.py, lot M7), comme le core
]

[project.optional-dependencies]
# openride-core sert aux tests seulement (vérification croisée avec load_world) :
# l'installer à part avec `pip install -e ../core`.
dev = ["pytest>=8"]
# Monde ouvert (série W) : lecture des extraits régionaux .osm.pbf (lot W3).
worldgen = ["osmium>=4.0"]

[project.scripts]
openride-compiler = "openride_compiler.cli:main"
openride-worldgen = "openride_compiler.worldgen.process:main"
openride-worldgen-fake = "openride_compiler.worldgen.synthetic:fake_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Le test d'intégration réseau (Copernicus réel) est sauté par défaut : `pytest -m network`.
addopts = "-m 'not network'"
markers = ["network: télécharge des tuiles Copernicus réelles (sauté par défaut)"]

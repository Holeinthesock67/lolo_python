[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openride-compiler"
version = "0.1.0"
description = "OpenRide Linux – compilateur de parcours : GPX vers .world (couche route)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyproj>=3.6",
]

[project.optional-dependencies]
# openride-core sert aux tests seulement (vérification croisée avec load_world) :
# l'installer à part avec `pip install -e ../core`.
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
openride-compiler = "openride_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

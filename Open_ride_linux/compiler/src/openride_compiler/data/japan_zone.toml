# Zone du biome `japan` (lot JP2, version 6.0 ; Format .world v1 §8 quater).
#
# Dans un de ces rectangles, en climat de Köppen `climates` (carte embarquée du lot U24), les arbres et les
# arbustes de WorldCover (classes 10 et 20 : cèdres sugi, cyprès hinoki, érables, bambous et sasa) donnent le biome
# `japan` au lieu de la forêt ou de la prairie tempérée. Rien d'autre ne change : cultures (rizières), bâti, eau,
# sol nu, neige et étage alpin gardent leur biome.
#
# Rectangles en degrés ENTIERS, comme les zones de regional_variants.toml (mêmes rectangles : toit `kawara`) :
# un point est dedans si lat_min <= lat < lat_max et lon_min <= lon < lon_max. Ils couvrent Kyūshū, Shikoku,
# Honshū et Hokkaidō, sans la Corée ni le continent ; le sud des Kouriles et la pointe sud de Sakhaline
# (moins de 15 km) y entrent. Okinawa (subtropical) n'y est pas.

climates = ["Cfa", "Cfb", "Dfa", "Dfb"]

[[box]]
name = "kyushu"
lat = [31, 34]
lon = [129, 132]

[[box]]
name = "chugoku_shikoku"
lat = [32, 36]
lon = [130, 136]

[[box]]
name = "kinki_chubu_kanto"
lat = [33, 38]
lon = [135, 141]

[[box]]
name = "tohoku"
lat = [37, 42]
lon = [139, 142]

[[box]]
name = "hokkaido"
lat = [41, 46]
lon = [139, 146]

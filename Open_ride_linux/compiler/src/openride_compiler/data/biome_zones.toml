# --- Bush à eucalyptus (lot V6-r4) : eucalyptus clairsemés, acacias (wattles), arbustes bas, terre rouge ------
# Australie hors tropiques humides (Aw et Am du nord restent savane et jungle) : climats méditerranéens,
# tempérés et semi-arides ; arbres (10) et arbustes (20, mallee). Prairies, cultures et déserts gardent leur biome.
[biome.eucalypt_woodland]
class = 205
koppen = ["Csa", "Csb", "Cfa", "Cfb", "Cwa", "BSh", "BSk"]
worldcover = [10, 20]

[[zone]]
biome = "eucalypt_woodland"
name = "australie"
lat = [-44, -10]
lon = [113, 154]

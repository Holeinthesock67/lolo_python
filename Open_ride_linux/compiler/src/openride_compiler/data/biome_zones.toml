# --- Japon (lot JP2) : forêts de cèdres sugi, cyprès hinoki, érables, bambous et sasa ----------------------
# Climats humides tempérés et continentaux (Cfa, Cfb, Dfa, Dfb) ; arbres (10) et arbustes (20). Cultures (rizières),
# bâti, eau, sol nu, neige et étage alpin gardent leur biome. Kyūshū, Shikoku, Honshū et Hokkaidō, sans la Corée ni
# le continent ; le sud des Kouriles et la pointe sud de Sakhaline (moins de 15 km) y entrent. Okinawa (subtropical)
# n'y est pas. Mêmes rectangles que les zones `japon_*` de regional_variants.toml (toit `kawara`).
[biome.japan]
class = 202
koppen = ["Cfa", "Cfb", "Dfa", "Dfb"]
worldcover = [10, 20]

[[zone]]
biome = "japan"
name = "kyushu"
lat = [31, 34]
lon = [129, 132]

[[zone]]
biome = "japan"
name = "chugoku_shikoku"
lat = [32, 36]
lon = [130, 136]

[[zone]]
biome = "japan"
name = "kinki_chubu_kanto"
lat = [33, 38]
lon = [135, 141]

[[zone]]
biome = "japan"
name = "tohoku"
lat = [37, 42]
lon = [139, 142]

[[zone]]
biome = "japan"
name = "hokkaido"
lat = [41, 46]
lon = [139, 146]

# --- Forêt de nuages tropicale (lot V6-r4) : fougères arborescentes, palmiers à cire, chênes moussus, bambous --
# Montagnes tropicales humides : à ces latitudes, les codes tempérés de Köppen (Cfb, Cfc, Cwb, Cwc) ne se trouvent
# qu'en altitude (environ 1 500 à 3 500 m), la carte porte donc seule l'étage, sans règle d'altitude à part. Arbres
# (10) seulement : prairies, páramo (arbustes), cultures (caféiers) et bâti gardent leur biome.
[biome.cloud_forest]
class = 204
koppen = ["Cfb", "Cfc", "Cwb", "Cwc"]
worldcover = [10]

[[zone]]
biome = "cloud_forest"
name = "andes_nord"
lat = [-6, 12]
lon = [-81, -66]

[[zone]]
biome = "cloud_forest"
name = "andes_centre"
lat = [-18, -6]
lon = [-80, -63]

[[zone]]
biome = "cloud_forest"
name = "amerique_centrale"
lat = [7, 18]
lon = [-93, -77]

[[zone]]
biome = "cloud_forest"
name = "afrique_de_l_est"
lat = [-12, 15]
lon = [28, 43]

# --- Forêt pluviale tempérée (lot V6-r4) : douglas, thuyas géants, épicéas de Sitka, fougères ----------------
# Côtes très humides à l'ouest des continents (Cfb, Cfc, Csb, Csc ; Dfb, Dfc, Dsb, Dsc sur les pentes des
# Cascades et des chaînes côtières) ; arbres (10) seulement. Rectangles étroits le long de la côte : l'intérieur
# (Colombie-Britannique sèche, Patagonie) garde la forêt boréale ou tempérée. L'ouest de la Tasmanie est avant le
# rectangle de l'Australie (le premier rectangle l'emporte).
[biome.temperate_rainforest]
class = 206
koppen = ["Cfb", "Cfc", "Csb", "Csc", "Dfb", "Dfc", "Dsb", "Dsc"]
worldcover = [10]

[[zone]]

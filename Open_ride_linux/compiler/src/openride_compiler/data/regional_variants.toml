# Table d'ébauche des variantes régionales (lot U4, série U, version 3.0 ; Format .world v1 §8 quater).
#
# Chaque tuile de la couche biome reçoit un couple {"ground", "roofs"} : roches et terres, architecture.
# Les deux membres se choisissent séparément, dans cet ordre :
#   1. la plus petite zone [[zone]] qui contient le centre de la tuile et qui donne ce membre ;
#   2. la première règle générale [[rule]] qui s'applique et qui donne ce membre ;
#   3. la variante neutre [neutral] ;
#   4. sinon le membre reste null (l'engine garde alors ce que donne le biome).
#
# Grosse maille seulement : bornes en degrés ENTIERS (une zone fait au moins 1° × 1°), aucune coordonnée
# plus fine. Les zones françaises suivent les grandes régions géologiques, pas les départements.
#
# Toits : une zone ne donne `roofs` que là où l'architecture régionale se distingue du style par biome de
# l'engine (building_styles.gd, BIOME_STYLES, lot U23 : chalet en montagne, pisé au désert, case en savane…).
# Les règles générales et la variante neutre ne donnent pas de toit : hors des zones, le biome décide.
#
# Identifiants (énumération fermée du contrat) :
#   ground : gres_rose, calcaire_blanc, granite_gris, schiste_sombre, basalte, laterite_rouge, craie
#   roofs  : tuile_ronde, ardoise, tuile_plate, pierre_seche, toit_plat_blanc, bois

[neutral]
ground = "calcaire_blanc"

# --- règles générales (ordre = priorité) ---------------------------------------------------------------
# `biomes` + `min_share` : part cumulée de ces biomes dans la tuile (0 à 1) ;
# `abs_lat_min` / `abs_lat_max` : |latitude| en degrés entiers, bornes comprises.

[[rule]]
name = "volcanique"
biomes = ["volcanic"]
min_share = 0.5
ground = "basalte"

[[rule]]
name = "aride"
biomes = ["sand_desert", "rock_desert"]
min_share = 0.5
ground = "gres_rose"

[[rule]]
name = "bouclier_nordique"
abs_lat_min = 58
ground = "granite_gris"

[[rule]]
name = "tropiques"
abs_lat_max = 23
ground = "laterite_rouge"


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openride-core"
version = "1.0.0"
description = "OpenRide Linux – core : BLE, physique, braquets, ERG, journal, FIT, IPC"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "fit-tool>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "garmin-fit-sdk>=21", "hypothesis>=6.100", "pip-audit>=2.7"]

[project.scripts]
openride-core = "openride_core.__main__:main"
openride = "openride_core.launcher:main"
openride-ble-diag = "openride_core.tools.ble_diag:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openride_core = ["data/*.toml", "data/*.json", "rogue/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests longs (séances simulées de 3 h) ; `pytest -m \"not slow\"` pour les sauter",
    "recette_sans_velo: étapes des recettes vélo faites sans vélo (T11 5 et 6, J7, et les blocs 7q, 7ae, 7af, 7ac du lot X48) ; `pytest -m recette_sans_velo`",
    "fuzz: fuzz des lecteurs de fichiers (lot X26) ; `pytest -m fuzz --hypothesis-profile=long` sur le PC",
]

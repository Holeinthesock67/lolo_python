# Plan d'entraînement OpenRide (docs/contracts/plan_format_v1.md), plan de référence du lot O11.
[plan]
name = "FTP 6 semaines"
description = "Test de rampe, deux blocs de seuil et de PMA séparés par une semaine plus légère, test final."
days_per_week = 3


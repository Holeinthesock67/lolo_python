# Table d'équilibrage de la Course tactique (lot CT0).
# Les valeurs ci-dessous sont celles du simulateur et du mode. Pour les changer sans toucher au code,
# copier ce fichier en ~/OpenRide/tactical_balance.toml et ne garder que les lignes modifiées.
# Une clé inconnue ou une valeur hors bornes est refusée avec un message qui nomme la clé.

# Course simulée (CT0)
dt_s = 0.5   # pas de la simulation (comme le calibrage des bots du lot T13)
rider_ftp_w = 250.0   # cycliste virtuel : FTP = CP
rider_w_prime_j = 20000.0   # cycliste virtuel : W′
rider_mass_kg = 75.0   # cycliste virtuel : masse sans le vélo
bike_mass_kg = 8.0   # vélo de tout le monde (bots compris, comme en séance)
bots_level_pct = 95.0   # bots calibrés seuls sur le circuit au temps du cycliste seul à ce % de FTP
form_spread_pct = 3.0   # jour avec, jour sans : CP de chacun tirée à ± 3 % (Y10 : 0,97 à 1,03)
# Surchauffe (CT2, décision du 29 octobre : 70 % de la CP pendant 8 s)
burnout_cap_pct = 70.0   # puissance prise en compte pendant le Burnout, en % de la CP
burnout_s = 8.0   # durée du Burnout
burnout_tolerance_s = 0.5   # réserve à 0 pendant 0,5 s avant le Burnout (retard de la puissance mesurée)
# Catapulte (CT4)
sling_full_s = 15.0   # charge pleine en 15 s roue dans la roue (abri 0,40)
sling_decay_pct_s = 10.0   # charge perdue par seconde sans abri (passé devant)
sling_gain_pct = 35.0   # puissance prise en compte majorée de 35 % à charge pleine...
sling_boost_s = 3.0   # ... pendant 3 s, sans vider la réserve (impulsion gratuite)
sling_min_pct = 30.0   # charge minimale pour lancer la catapulte
sling_cooldown_s = 60.0   # au plus une catapulte par minute
# Pacte de relais et capacités (CT6, effets du catalogue 4.0)
relay_min_s = 15.0   # un relais en tête compte à partir de 15 s
credits_full_kj = 25.0   # travail aérodynamique donné aux suiveurs pour remplir la jauge
breakaway_cost_pct = 25.0   # « Échappée » (`breakaway`) : pas d'abri pour les suiveurs...
breakaway_s = 20.0   # ... et pas de réponse des bots pendant 20 s
shield_cost_pct = 50.0   # « Bouclier d'inertie » : pas de Burnout...
shield_s = 10.0   # ... pendant 10 s
aero_cost_pct = 100.0   # « Casque aéro » (`aero`) : CdA × 0,75...
aero_s = 20.0   # ... pendant 20 s
aero_cda_mult = 0.75   # CdA multiplié par 0,75 pendant le Casque aéro
# Cerveau des bots (CT3, sur les règles de Y10)
bot_follow_cp_pct = 125.0   # un bot qui suit une accélération roule au plus à 1,25 × CP...
bot_follow_reserve_pct = 40.0   # ... s'il lui reste plus de 40 % de réserve...
bot_follow_stop_pct = 20.0   # ... et il lâche sous 20 %
bot_error_pct = 10.0   # erreur de jugement (10 %, difficulté 50 %) : il suit quand même et peut exploser
bot_relay_reserve_pct = 30.0   # pas de relais sous 30 % de réserve
bot_relay_min_s = 30.0   # relais de 30 s (réserve à 30 %)...
bot_relay_max_s = 60.0   # ... à 60 s (réserve pleine)
bot_chase_cp_pct = 108.0   # en tête d'un groupe, poursuite à 1,08 × CP d'un coureur parti devant...
bot_chase_look_m = 400.0   # ... à moins de 400 m
baroudeur_cp_pct = 108.0   # baroudeur : échappée à 1,08 × CP...
baroudeur_until_pct = 60.0   # ... lancée dans les 60 premiers % de la course...
baroudeur_stop_pct = 25.0   # ... tenue jusqu'à 25 % de réserve...
baroudeur_restart_pct = 80.0   # ... et relancée quand la réserve est remontée à 80 %
punch_cp_pct = 145.0   # puncheur : attaque à 1,45 × CP...
punch_climb_max_m = 1500.0   # ... dans une bosse de 1,5 km au plus...
punch_from_m = 600.0   # ... à 600 m du sommet...
punch_reserve_pct = 50.0   # ... s'il lui reste plus de 50 % de réserve
pull_off_pct = 85.0   # fin de relais : puissance à 85 % pendant qu'on se fait doubler...
pull_off_max_s = 15.0   # ... au plus 15 s
bot_climb_attack_cp_pct = 120.0   # attaque du grimpeur en montée : 1,2 × CP (T12 : 1,1 en séance)...
bot_climb_attack_reserve_pct = 40.0   # ... tant qu'il lui reste plus de 40 % de réserve
bot_sprint_cp_pct = 220.0   # sprint final des bots sans pic : 2,2 × CP
bot_sprint_m = 250.0   # sprint lancé à 250 m de l'arrivée (le sprinteur garde son pic à 200 m)
bot_attack_cp_pct = 130.0   # attaque d'un rouleur dans le final : 1,3 × CP...
bot_attack_from_m = 3500.0   # ... entre 3,5 km...
bot_attack_to_m = 800.0   # ... et 800 m de l'arrivée...
bot_attack_stop_pct = 15.0   # ... tenue jusqu'à 15 % de réserve
# Cycliste virtuel (stratégies du simulateur)
rider_relay_s = 45.0   # « rouleur » : relais de 45 s
rider_attack_cp_pct = 130.0   # « attaquant » : contre à 1,3 × CP...
rider_attack_trigger_pct = 10.0   # ... quand un bot de son groupe passe sous 10 % de réserve
rider_attack_min_pct = 50.0   # ... s'il lui reste plus de 50 %
rider_cut_pct = 3.0   # il coupe son effort à 3 % de réserve (évite le Burnout)
rider_solo_cp_pct = 100.0   # « échappée » : seul devant à la CP
rider_sprint_cp_pct = 200.0   # sprint du cycliste : 2 × CP...
rider_sprint_m = 250.0   # ... dans les 250 derniers mètres
rider_finale_m = 1500.0   # capacités achetées dans les 1 500 derniers mètres

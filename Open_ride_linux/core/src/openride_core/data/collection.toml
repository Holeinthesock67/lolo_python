# Catalogue de la collection de cartes (série BC, 5.0, lot BC1).
#
# Fichier livré avec le core, lu par `collection.py`. Tout se recalcule depuis le journal des
# séances comptées par la progression (`progression.recompute`) : changer une valeur ici change
# aussi les cartes des séances passées. Plan de la série : docs/5.0/PLAN_SERIE_BC.md.
#
# Une carte : `id` (minuscules, chiffres, `_`), `title` (24 caractères au plus), `text` (ligne
# d'ambiance, 70 caractères au plus), `family` (voir FAMILIES de collection.py), `rarity`
# (commune, rare, epique, legendaire), `visual` (nom du visuel, fiche de commande du lot BC4)
# et `rule`, table dont `kind` est l'une des règles ci-dessous.
#
#   cumul        stat de la progression (progression.STATS) atteinte : `stat`, `threshold`
#   defi         défi de la série V réussi (data/progression.toml) : `challenge`
#   seance       `count` séances (défaut 1) d'au moins `min_km`, `min_climb_m`, `min_minutes`
#   heure        `count` séances commencées entre `from_h` et `to_h` (heure locale, `to_h` <
#                `from_h` passe minuit), d'au moins `min_minutes`
#   semaines     `count` semaines ISO d'affilée avec au moins `per_week` séances
#   jours        `count` jours d'affilée avec au moins une séance
#   mode         `count` lignes de jeu `event` (progression.FACT_EVENT_KINDS) ; `win = true` :
#                Dernier survivant gagné (place 1)
#   saison       séance d'au moins `min_minutes` entre `from` et `to` ("MM-JJ", l'intervalle
#                peut passer le 31 décembre), ou autour de Pâques (`easter_from`, `easter_to`,
#                jours depuis le dimanche de Pâques) ; une édition par année
#   anniversaire séance au moins `years` ans après la première séance comptée


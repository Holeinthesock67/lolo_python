# Tables de la progression (série V) : expérience, niveaux et défis.
#
# Fichier livré avec le core. Pour changer une valeur, copier seulement les clés voulues dans
# ~/OpenRide/progression.toml : elles remplacent celles d'ici (une liste [[challenges]] remplace
# toute la liste). Tout se recalcule depuis le journal des séances : changer une valeur change
# aussi l'expérience des séances passées.

[xp]
per_km = 20                  # points par km roulé
per_climb_m = 2              # points par mètre de dénivelé positif
erg_per_min = 10             # points par minute d'entraînement ERG
erg_completed_bonus = 0.20   # + 20 % si l'entraînement est terminé
per_segment = 50             # série T (lot V5)
per_segment_pr = 100         # record personnel sur un segment, en plus
per_jersey = 200             # maillot gagné dans la séance
rogue_per_min = 10           # run Cyber-Rogue (série R)
rogue_boss_default = 100     # boss vaincu absent de la table ci-dessous (valeur provisoire)

[xp.rogue_boss]
chimere_centrale = 300       # boss final (valeur provisoire, à régler avec la série R)

[rules]
min_session_s = 300          # séance de moins de 5 min chronométrées : rien
climb_deadband_m = 1.0       # variation d'altitude ignorée sous ce seuil (bruit)
erg_replaces_distance = true # en ERG, les minutes remplacent la distance et le dénivelé (V-Q7)

[levels]
count = 50
xp_level_2 = 1000            # points pour passer au niveau 2
xp_level_max = 100000        # points cumulés pour le dernier niveau

# Pièces (lot V3b) : gagnées avec l'expérience (mêmes séances), dépensées au Garage et pour des
# vies du mode Cyber-Rogue. En ERG, avec `erg_replaces_distance`, les minutes remplacent la distance.
[coins]
# Pièces à l'effort (V-Q10, 27 octobre) : chaque minute rapporte selon la puissance en % de
# la FTP, en SIM comme en ERG. Zones [seuil en % de la FTP, pièces par minute], seuils croissants.
# Une heure d'endurance (65 %) : 30 pièces ; une heure avec 2 × 20 min au seuil : 70 pièces.
effort = [[0, 0.25], [55, 0.5], [75, 1.0], [90, 1.5], [105, 2.0]]
per_segment = 5
per_segment_pr = 10          # record personnel sur un segment (série T)
per_power_record = 15        # record de puissance moyenne battu sur 5 s, 1, 5 ou 20 min
per_jersey = 20
rogue_boss_default = 10      # boss vaincu absent de la table ci-dessous
life_price = 30              # une vie du mode Cyber-Rogue (lot R9)
max_lives = 3                # vies en réserve au plus
rogue_gold_per_coin = 10     # or de la run converti en pièces : 1 pièce pour 10 or

[coins.rogue_boss]
chimere_centrale = 50

# Châssis du mode Cyber-Rogue (lot R9) : un seul choisi avant la run, bonus bornés (au plus 10 % de la
# valeur du jeu ; l'adrénaline de départ, nulle au repos, est bornée à 20). `unlock` : statistique des runs
# (boss_won, perfect_shifts, gold_total, vo2max_runs, endurance_runs) et `threshold` : valeur à atteindre.
# `bonus` : ajout à une constante de RogueBalance (shield_max, ps_window_s, gold_mult, adrenaline_start,
# overheat_frac) ; jamais la pente envoyée ni la puissance demandée.
[[chassis]]
id = "standard"
name = "Standard"
text = "Aucun bonus"
unlock = "none"
threshold = 0

[[chassis]]
id = "blinde"
name = "Blindé"
text = "Bouclier maximal +10"
unlock = "boss_won"
threshold = 1
bonus = { shield_max = 10.0 }

[[chassis]]
id = "conducteur"
name = "Conducteur"
text = "Fenêtre de Perfect Shift +0,15 s"
unlock = "perfect_shifts"
threshold = 50
bonus = { ps_window_s = 0.15 }

[[chassis]]
id = "collecteur"
name = "Collecteur"
text = "Or gagné +10 %"
unlock = "gold_total"
threshold = 500
bonus = { gold_mult = 0.10 }

[[chassis]]
id = "survolte"
name = "Survolté"
text = "Adrénaline de départ 20"
unlock = "vo2max_runs"
threshold = 3
bonus = { adrenaline_start = 20.0 }

[[chassis]]
id = "endurant"
name = "Endurant"
text = "Surchauffe à 0,78 FTP au lieu de 0,75"
unlock = "endurance_runs"
threshold = 3
bonus = { overheat_frac = 0.03 }


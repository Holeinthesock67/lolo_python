# Lieu de la météo : PAS ici. Il se règle dans la feuille « Coach – Carnet », onglet Réglages, ligne « Lieu météo »
# (ville, « ville, pays » ou « latitude ; longitude »). Le Pi la lit chaque matin (settings_source.py) et garde
# le dernier lieu connu dans data/location.json.
[settings]
remote = "coachro:Coach – Carnet.xlsx"   # accès rclone en lecture seule au dossier « Coach - Garmin export »
key = "Lieu météo"

# Secours facultatif, utilisé seulement si la feuille n'a jamais pu être lue :
# [location]
# name = "Ma ville"
# latitude = 0.0
# longitude = 0.0
# timezone = "Europe/Paris"

[sync]
days_back_first_run = 90   # historique récupéré au tout premier lancement
refetch_days = 3           # les derniers jours sont ré-lus (VFC/sommeil se finalisent plus tard)
pause_seconds = 0.7        # pause entre appels Garmin (évite le blocage 429)

[paths]
database = "data/coach.db"
tokenstore = "~/.garminconnect"
export_dir = "export"
